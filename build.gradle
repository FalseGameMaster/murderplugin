plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.14"
}

group = 'dev.falsegamemaster'
version = '0.1.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
//    compileOnly("io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT")
    compileOnly("dev.falsegamemaster:propengine:0.1.1")
    paperweight.paperDevBundle("1.21.1-R0.1-SNAPSHOT")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.1")
    }
}

tasks.register("copyPropEnginePlugin", Copy) {
    dependsOn(gradle.includedBuild("propengine").task(":jar"))

    def propEngineJar = fileTree("../propengine/build/libs") {
        include("*.jar")
        exclude("*-sources.jar")
        exclude("*-javadoc.jar")
        exclude("*-dev.jar")
    }

    from(propEngineJar)
    into(file("run/plugins"))

    doFirst {
        println "Copying PropEngine jars:"
        propEngineJar.files.each {
            println " - ${it.absolutePath}"
        }

        delete fileTree(file("run/plugins")) {
            include("*propengine*.jar")
            include("*PropEngine*.jar")
        }
    }

    doLast {
        println "Copied into: ${file("run/plugins").absolutePath}"
    }
}

tasks.named("runServer") {
    dependsOn("copyPropEnginePlugin")
}


tasks.register("debugPropEngineCopy") {
    dependsOn(gradle.includedBuild("propengine").task(":jar"))

    doLast {
        println "Murder project dir: ${layout.projectDirectory.asFile}"
        println "Expected plugins dir: ${layout.projectDirectory.dir("run/plugins").asFile}"
        println "PropEngine libs dir: ${file("../propengine/build/libs").absolutePath}"

        fileTree("../propengine/build/libs") {
            include("*.jar")
        }.files.each {
            println "Found jar: ${it.name}"
        }
    }
}


def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
